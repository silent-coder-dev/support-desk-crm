name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Tests use an in-memory H2 database, so no MySQL or secrets are needed
      - name: Build and test
        working-directory: support-crm
        run: ./mvnw -B verify
