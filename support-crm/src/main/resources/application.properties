spring.application.name=support-crm

# Reads local secrets from a .env file, in this folder or the one above. Real environment variables, as on Render, win.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Defaults here are safe for production. For local work run with the "dev" profile (application-dev.properties).

# Server Port (Render and most cloud hosts pass PORT)
server.port=${PORT:8080}
# The app sits behind a TLS proxy, so trust its X-Forwarded-* headers
server.forward-headers-strategy=framework
server.compression.enabled=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# MySQL Connection Settings
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Hikari Connection Pool (Smooth multi-threading)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Brevo email (HTTP API, which works on Render's free plan). The sender must be verified in Brevo.
app.mail.api-key=${BREVO_API_KEY:}
app.mail.from-email=${MAIL_FROM_EMAIL:}
app.mail.from-name=${MAIL_FROM_NAME:SupportDesk}

# Cloudinary CDN Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Multipart File Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# Read a too-big upload to the end so the browser gets our error message, not a reset connection
server.tomcat.max-swallow-size=20MB

# Health check: only /actuator/health is exposed
management.endpoints.web.exposure.include=health

# Application settings
# Public URL used inside customer emails
app.base-url=${APP_BASE_URL:http://localhost:8080}
# Anyone who signs up can read every customer ticket, so public signup stays off unless you turn it on
app.signup.enabled=${APP_SIGNUP_ENABLED:false}
# Password for the first "admin" account. No admin is created while this is empty.
app.admin.password=${ADMIN_PASSWORD:}
app.admin.email=${ADMIN_EMAIL:admin@supportcrm.com}
