<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:with="isAdminPortal=${portal == 'admin'}">
<head th:replace="~{fragments/layout :: head(${portal == 'admin' ? 'Admin sign in' : 'Staff sign in'})}"></head>
<body>

<!-- One template for /admin-login and /staff-login. "portal" picks the wording and color. -->
<div class="login-shell">
    <aside class="login-panel" th:classappend="${isAdminPortal} ? 'login-panel-admin'">
        <div class="brand brand-light">
            <span class="brand-mark"><i class="bi bi-shield-check" aria-hidden="true"></i></span>
            <span>SupportDesk</span>
        </div>
        <div>
            <h2 th:text="${isAdminPortal ? 'Admin console' : 'Staff workspace'}">Staff workspace</h2>
            <p th:text="${isAdminPortal ? 'See how your team is doing, manage staff accounts, and keep every ticket moving.' : 'Pick up tickets, keep customers updated, and resolve issues from one live queue.'}">Text</p>
        </div>
    </aside>

    <main class="login-main">
        <div class="login-form">
            <h1 class="h3 mb-1" th:text="${isAdminPortal ? 'Admin sign in' : 'Staff sign in'}">Sign in</h1>
            <p class="text-muted small mb-4" th:text="${isAdminPortal ? 'Administrators only.' : 'Use the login your administrator gave you.'}">Text</p>

            <div th:if="${errorMessage}" class="notice notice-error" role="alert" th:text="${errorMessage}">Invalid username or password</div>
            <div th:if="${logoutMessage}" class="notice notice-info" th:text="${logoutMessage}">Logged out</div>
            <div th:if="${successMessage}" class="notice notice-success" th:text="${successMessage}">Account created</div>

            <form th:action="@{/login}" method="post">
                <input type="hidden" name="portal" th:value="${portal}">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" name="username" class="form-control" autocomplete="username" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-control" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100">Sign in</button>
            </form>

            <div class="center-links">
                <div th:if="${signupEnabled and !isAdminPortal}" class="mb-1">New agent? <a th:href="@{/signup}">Register Account</a></div>
                <a th:href="@{/}"><i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Back to home</a>
            </div>
        </div>
    </main>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
