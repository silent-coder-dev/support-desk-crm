<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Create agent account')}"></head>
<body>

<div class="center-shell">
    <div class="center-brand"><a th:replace="~{fragments/layout :: brand('/')}"></a></div>

    <main class="card-surface center-card center-card-wide">
        <h1 class="h4 mb-1">Create agent account</h1>
        <p class="text-muted small mb-3">Agents can view and update all customer tickets.</p>

        <form th:action="@{/signup}" th:object="${registerRequest}" method="post">
            <div class="mb-3">
                <label for="fullname" class="form-label">Full name</label>
                <input type="text" th:field="*{fullname}" class="form-control" autocomplete="name" required>
                <div class="field-error" th:if="${#fields.hasErrors('fullname')}" th:errors="*{fullname}"></div>
            </div>
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" th:field="*{username}" class="form-control" autocomplete="username" required>
                <div class="field-hint">Lowercase letters and numbers only, 3 to 25 characters.</div>
                <div class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" th:field="*{email}" class="form-control" autocomplete="email" required>
                <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <div class="mb-3">
                <label for="mobileNumber" class="form-label">Mobile number</label>
                <input type="tel" th:field="*{mobileNumber}" class="form-control" autocomplete="tel" placeholder="10 digits" required>
                <div class="field-error" th:if="${#fields.hasErrors('mobileNumber')}" th:errors="*{mobileNumber}"></div>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" th:field="*{password}" class="form-control" autocomplete="new-password" required>
                <ul class="rule-list" id="passwordRules">
                    <li data-rule=".{8,}">8 or more characters</li>
                    <li data-rule="[a-z]">A lowercase letter</li>
                    <li data-rule="[A-Z]">An uppercase letter</li>
                    <li data-rule="[0-9]">A number</li>
                    <li data-rule="[@$!%*?&#]">One of @$!%*?&amp;#</li>
                </ul>
                <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Create account</button>
        </form>
    </main>

    <div class="center-links">Already have an account? <a th:href="@{/staff-login}">Sign in</a></div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
    // Ticks off each password rule as it is met
    document.getElementById('password').addEventListener('input', event => {
        document.querySelectorAll('#passwordRules li').forEach(rule => {
            rule.classList.toggle('met', new RegExp(rule.dataset.rule).test(event.target.value));
        });
    });
</script>
</body>
</html>
