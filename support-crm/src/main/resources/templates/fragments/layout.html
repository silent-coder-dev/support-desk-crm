<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Everything repeated across pages lives here, so a change only has to be made once. -->

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | SupportDesk'">SupportDesk</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'%3E%3Cpath d='M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z'/%3E%3C/svg%3E">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<!-- The product name and logo -->
<a th:fragment="brand(target)" th:href="@{${target}}" class="brand">
    <span class="brand-mark"><i class="bi bi-shield-check" aria-hidden="true"></i></span>
    <span>SupportDesk</span>
</a>

<!-- Navigation for agents and admins. "active" names the current page. -->
<nav th:fragment="appNav(active)" class="navbar navbar-expand-lg app-nav"
     th:with="isAdmin=${currentUser != null and #strings.endsWith(currentUser.role, 'ADMIN')}"
     th:classappend="${isAdmin} ? 'is-sidebar'">
    <div class="container">
        <a th:replace="~{fragments/layout :: brand(${isAdmin ? '/admin/dashboard' : '/tickets'})}"></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#appNavLinks"
                aria-controls="appNavLinks" aria-expanded="false" aria-label="Toggle navigation">
            <i class="bi bi-list" aria-hidden="true"></i>
        </button>
        <div class="collapse navbar-collapse" id="appNavLinks">
            <div class="nav-group d-flex flex-column flex-lg-row gap-1 ms-lg-4">
                <a th:if="${isAdmin}" th:href="@{/admin/dashboard}" class="nav-link-item" th:classappend="${active == 'dashboard'} ? 'active'"><i class="bi bi-grid nav-icon" aria-hidden="true"></i>Dashboard</a>
                <a th:href="@{/tickets}" class="nav-link-item" th:classappend="${active == 'queue'} ? 'active'"><i class="bi bi-inbox nav-icon" aria-hidden="true"></i>Queue</a>
                <a th:if="${isAdmin}" th:href="@{/admin/tickets}" class="nav-link-item" th:classappend="${active == 'registry'} ? 'active'"><i class="bi bi-card-list nav-icon" aria-hidden="true"></i>All tickets</a>
                <a th:if="${isAdmin}" th:href="@{/admin/staff}" class="nav-link-item" th:classappend="${active == 'staff'} ? 'active'"><i class="bi bi-people nav-icon" aria-hidden="true"></i>Staff</a>
            </div>
            <div class="nav-account d-flex flex-column flex-lg-row align-items-lg-center gap-2 ms-lg-auto mt-2 mt-lg-0">
                <a th:href="@{/profile}" class="user-link">
                    <img th:if="${currentUser != null and currentUser.avatarUrl != null}" th:src="${currentUser.avatarUrl}" class="avatar" alt="">
                    <span th:if="${currentUser == null or currentUser.avatarUrl == null}" class="avatar"><i class="bi bi-person-fill" aria-hidden="true"></i></span>
                    <span th:text="${currentUser != null ? currentUser.fullname : 'Profile'}">Profile</span>
                </a>
                <!-- Logout changes state, so it is a POST with a CSRF token. A plain link could be triggered by any other website. -->
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-quiet btn-sm">Log out</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<!-- Navigation for public customer pages -->
<nav th:fragment="portalNav(active)" class="app-nav">
    <div class="container d-flex flex-wrap align-items-center justify-content-between gap-2">
        <a th:replace="~{fragments/layout :: brand('/')}"></a>
        <div class="d-flex gap-1">
            <a th:href="@{/}" class="nav-link-item d-none d-sm-block" th:classappend="${active == 'home'} ? 'active'">Home</a>
            <a th:href="@{/portal/inquiry}" class="nav-link-item" th:classappend="${active == 'inquiry'} ? 'active'">Submit a request</a>
            <a th:href="@{/portal/track}" class="nav-link-item" th:classappend="${active == 'track'} ? 'active'">Track a request</a>
        </div>
    </div>
</nav>

<!-- Colored status label. The text always says the status, so color is never the only signal. -->
<span th:fragment="status(value)" class="status"
      th:classappend="'status-' + ${#strings.toLowerCase(value.name())}"
      th:text="${#strings.capitalize(#strings.toLowerCase(#strings.replace(value.name(), '_', ' ')))}">Open</span>

<!-- Pop-up message from the server. Shown by app.js. -->
<div th:fragment="toast(message, type)" th:if="${message != null}" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1080;">
    <div class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body d-flex align-items-center gap-2">
                <i class="bi" th:classappend="${type == 'danger'} ? 'bi-exclamation-circle-fill' : 'bi-check-circle-fill'" aria-hidden="true"></i>
                <span th:text="${message}">Saved</span>
            </div>
            <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>

<!-- Scripts every page loads, at the end of body -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>

</html>
