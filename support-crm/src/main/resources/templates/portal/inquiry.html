<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Submit a request')}"></head>
<body>

<nav th:replace="~{fragments/layout :: portalNav('inquiry')}"></nav>

<main class="container page page-narrow">
    <a th:href="@{/}" class="back-link"><i class="bi bi-arrow-left" aria-hidden="true"></i>Back to home</a>

    <div th:if="${createdRef}" class="card-surface card-body-pad mb-3 text-center" role="status">
        <i class="bi bi-check-circle-fill fs-3 text-success" aria-hidden="true"></i>
        <h2 class="h5 mt-2 mb-1" th:text="${alreadyOpen ? 'You already have an open request' : 'We''ve received your request'}">Received</h2>
        <p class="text-muted small mb-2" th:text="${alreadyOpen ? 'No need to send it again. We added anything new to this request.' : 'Keep this reference to track your request.'}">Keep this reference.</p>
        <div class="ticket-id fs-5 mb-3" id="createdRef" th:text="${createdRef}">TKT-001</div>
        <a th:href="@{/portal/track(ref=${createdRef})}" class="btn btn-outline btn-sm">Track this request</a>
    </div>

    <div class="card-surface card-body-pad">
        <h1 class="page-title mb-1">Submit a request</h1>
        <p class="page-subtitle mb-4">Tell us what's wrong and a support agent will take it from here. No account needed.</p>

        <form th:action="@{/portal/inquiry}" th:object="${ticketRequest}" method="post" id="inquiryForm" novalidate>
            <div class="notice notice-error" role="alert" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></div>

            <!-- Trap for bots: people never see this field, so anything typed here came from a script -->
            <div class="trap-field" aria-hidden="true">
                <label for="website">Website</label>
                <input type="text" th:field="*{website}" tabindex="-1" autocomplete="off">
            </div>

            <div class="row g-3 mb-3">
                <div class="col-sm-6">
                    <label for="customer_name" class="form-label">Your name</label>
                    <input type="text" th:field="*{customer_name}" class="form-control" maxlength="255" autocomplete="name" data-label="your name">
                    <div class="field-error" th:if="${#fields.hasErrors('customer_name')}" th:errors="*{customer_name}"></div>
                </div>
                <div class="col-sm-6">
                    <label for="customer_email" class="form-label">Email</label>
                    <input type="email" th:field="*{customer_email}" class="form-control" maxlength="255" autocomplete="email" data-label="your email">
                    <div class="field-error" th:if="${#fields.hasErrors('customer_email')}" th:errors="*{customer_email}"></div>
                </div>
            </div>
            <div class="mb-3">
                <label for="subject" class="form-label">Subject</label>
                <input type="text" th:field="*{subject}" class="form-control" placeholder="A short summary" maxlength="255" data-label="a subject">
                <div class="field-error" th:if="${#fields.hasErrors('subject')}" th:errors="*{subject}"></div>
            </div>
            <div class="mb-4">
                <label for="description" class="form-label">Description</label>
                <textarea rows="5" th:field="*{description}" class="form-control" placeholder="What happened? Include any error messages." maxlength="5000" data-label="a description"></textarea>
                <div class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
            </div>
            <button type="submit" class="btn btn-primary" id="submitRequest">Submit request</button>
        </form>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
    // Checks the form before sending. The server checks everything again, because scripts can skip this.
    const form = document.getElementById('inquiryForm');
    const EMAIL = /^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/;

    function showError(input, message) {
        let error = input.parentElement.querySelector('.js-error');
        if (!error) {
            error = document.createElement('div');
            error.className = 'field-error js-error';
            input.after(error);
        }
        error.textContent = message;
        input.classList.toggle('is-invalid', message !== '');
    }

    form.addEventListener('submit', event => {
        let firstBad = null;
        form.querySelectorAll('[data-label]').forEach(input => {
            const value = input.value.trim();
            let message = '';
            if (value === '') message = 'Please enter ' + input.dataset.label + '.';
            else if (input.type === 'email' && !EMAIL.test(value)) message = 'Please enter a valid email, like name@example.com.';
            showError(input, message);
            if (message && !firstBad) firstBad = input;
        });
        if (firstBad) {
            event.preventDefault();
            firstBad.focus();
            return;
        }
        // A double click must not send the form twice
        const button = document.getElementById('submitRequest');
        button.disabled = true;
        button.textContent = 'Sending...';
    });
</script>
</body>
</html>
