<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('All tickets')}"></head>
<body>

<nav th:replace="~{fragments/layout :: appNav('registry')}"></nav>

<main class="container page">
    <a th:href="@{/admin/dashboard}" class="back-link"><i class="bi bi-arrow-left" aria-hidden="true"></i>Dashboard</a>
    <div class="page-header">
        <div>
            <h1 class="page-title">All tickets</h1>
            <p class="page-subtitle"><span th:text="${tickets.size() == 1 ? '1 ticket' : tickets.size() + ' tickets'}">0 tickets</span>, newest first</p>
        </div>
    </div>

    <div class="card-surface overflow-hidden">
        <div class="toolbar">
            <form method="get" th:action="@{/admin/tickets}" class="toolbar-form">
                <div class="toolbar-search">
                    <i class="bi bi-search" aria-hidden="true"></i>
                    <input type="search" name="search" class="form-control" placeholder="Search customer, ID, or subject"
                           aria-label="Search tickets" th:value="${searchQuery}" autocomplete="off">
                </div>
                <select name="status" class="form-select" aria-label="Filter by status" onchange="this.form.submit()">
                    <option value="">All statuses</option>
                    <option value="OPEN" th:selected="${selectedStatus != null and selectedStatus.name() == 'OPEN'}">Open</option>
                    <option value="IN_PROGRESS" th:selected="${selectedStatus != null and selectedStatus.name() == 'IN_PROGRESS'}">In progress</option>
                    <option value="CLOSED" th:selected="${selectedStatus != null and selectedStatus.name() == 'CLOSED'}">Closed</option>
                </select>
                <a th:if="${searchQuery != null or selectedStatus != null}" th:href="@{/admin/tickets}" class="btn btn-quiet">Reset</a>
            </form>
        </div>

        <div class="table-responsive">
            <table class="data-table">
                <thead>
                <tr>
                    <th>Ticket</th>
                    <th class="d-none d-sm-table-cell">Customer</th>
                    <th>Subject</th>
                    <th>Status</th>
                    <th class="d-none d-md-table-cell">Assigned to</th>
                    <th class="d-none d-lg-table-cell">Created</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="t : ${tickets}">
                    <td><a th:href="@{'/admin/tickets/' + ${t.ticket_id}}" class="ticket-id" th:text="${t.ticket_id}">TKT-001</a></td>
                    <td class="cell-strong text-nowrap d-none d-sm-table-cell" th:text="${t.customer_name}">Customer</td>
                    <td class="cell-truncate" th:text="${t.subject}">Subject</td>
                    <td><span th:replace="~{fragments/layout :: status(${t.status})}"></span></td>
                    <td class="text-nowrap d-none d-md-table-cell" th:classappend="${t.assigned_agent_name == null} ? 'text-muted'" th:text="${t.assigned_agent_name != null ? t.assigned_agent_name : 'Unassigned'}">Agent</td>
                    <td class="text-muted text-nowrap d-none d-lg-table-cell" th:text="${#temporals.format(t.created_at, 'dd MMM yyyy, hh:mm a')}">Date</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:if="${#lists.isEmpty(tickets)}" class="empty-state">
            <i class="bi bi-inbox" aria-hidden="true"></i>
            No tickets found. Try a different search or filter.
        </div>
        <div class="list-note" th:if="${tickets.size() >= ticketLimit}">
            Showing the newest <span th:text="${ticketLimit}">500</span> tickets. Use search to find older ones.
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
