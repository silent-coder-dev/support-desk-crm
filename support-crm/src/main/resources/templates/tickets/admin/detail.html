<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head(${ticket.ticket_id})}"></head>
<body>

<nav th:replace="~{fragments/layout :: appNav('registry')}"></nav>

<main class="container page">
    <a th:href="@{/admin/tickets}" class="back-link"><i class="bi bi-arrow-left" aria-hidden="true"></i>All tickets</a>
    <div class="page-header">
        <div>
            <div class="d-flex align-items-center gap-2 mb-1">
                <span class="ticket-id" th:text="${ticket.ticket_id}">TKT-001</span>
                <span th:replace="~{fragments/layout :: status(${ticket.status})}"></span>
            </div>
            <h1 class="page-title" th:text="${ticket.subject}">Subject</h1>
        </div>
        <a th:href="@{'/tickets/' + ${ticket.ticket_id}}" class="btn btn-outline">Open in queue to edit</a>
    </div>

    <div class="row g-3">
        <div class="col-lg-8">
            <section class="card-surface card-body-pad mb-3">
                <h2 class="section-title">Description</h2>
                <p class="body-text" th:text="${ticket.description}">Description</p>
            </section>
            <section class="card-surface card-body-pad">
                <h2 class="section-title">Activity</h2>
                <div th:each="n : ${ticket.notes}" class="note">
                    <div class="note-meta">
                        <span class="note-author" th:text="${n.author_name}">Support Agent</span>
                        <span class="note-time" th:text="${#temporals.format(n.created_at, 'dd MMM yyyy, hh:mm a')}">Time</span>
                    </div>
                    <p class="body-text" th:text="${n.note_text}">Note</p>
                </div>
                <p th:if="${#lists.isEmpty(ticket.notes)}" class="text-muted small mb-0">No notes yet.</p>
            </section>
        </div>
        <div class="col-lg-4">
            <section class="card-surface card-body-pad">
                <h2 class="section-title">Customer</h2>
                <div class="mb-3">
                    <div class="detail-label">Name</div>
                    <div class="detail-value" th:text="${ticket.customer_name}">Name</div>
                </div>
                <div class="mb-3">
                    <div class="detail-label">Email</div>
                    <div class="detail-value"><a th:href="'mailto:' + ${ticket.customer_email}" th:text="${ticket.customer_email}">email</a></div>
                </div>
                <div>
                    <div class="detail-label">Version</div>
                    <div class="detail-value mono" th:text="${ticket.version}">0</div>
                </div>
            </section>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
