<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Add staff')}"></head>
<body>

<nav th:replace="~{fragments/layout :: appNav('staff')}"></nav>

<main class="container page">
    <div class="page-narrow">
        <a th:href="@{/admin/staff}" class="back-link"><i class="bi bi-arrow-left" aria-hidden="true"></i>Staff</a>

        <div class="card-surface card-body-pad">
            <h1 class="page-title mb-1">Add staff</h1>
            <p class="page-subtitle mb-4">We'll create a temporary password for you to share with them.</p>

            <form th:action="@{/admin/staff}" th:object="${staffRequest}" method="post">
                <div class="mb-3">
                    <label for="fullname" class="form-label">Full name</label>
                    <input type="text" th:field="*{fullname}" class="form-control" autocomplete="off" required>
                    <div class="field-error" th:if="${#fields.hasErrors('fullname')}" th:errors="*{fullname}"></div>
                </div>
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" th:field="*{username}" class="form-control" autocomplete="off" required>
                    <div class="field-hint">Lowercase letters and numbers only, 3 to 25 characters.</div>
                    <div class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-sm-7">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" th:field="*{email}" class="form-control" autocomplete="off" required>
                        <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>
                    <div class="col-sm-5">
                        <label for="mobileNumber" class="form-label">Mobile number (optional)</label>
                        <input type="tel" th:field="*{mobileNumber}" class="form-control" autocomplete="off" placeholder="10 digits">
                        <div class="field-error" th:if="${#fields.hasErrors('mobileNumber')}" th:errors="*{mobileNumber}"></div>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="role" class="form-label">Role</label>
                    <select th:field="*{role}" class="form-select">
                        <option value="ROLE_AGENT">Agent: works on tickets</option>
                        <option value="ROLE_ADMIN">Admin: also manages staff and sees the dashboard</option>
                    </select>
                    <div class="field-error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Add staff member</button>
                    <a th:href="@{/admin/staff}" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
