<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('New ticket')}"></head>
<body>

<nav th:replace="~{fragments/layout :: appNav('queue')}"></nav>

<main class="container page page-narrow">
    <a th:href="@{/tickets}" class="back-link"><i class="bi bi-arrow-left" aria-hidden="true"></i>Queue</a>

    <div class="card-surface card-body-pad">
        <h1 class="page-title mb-1">New ticket</h1>
        <p class="page-subtitle mb-4">Log a request on a customer's behalf. They'll get a confirmation email.</p>

        <form th:action="@{/tickets/new}" th:object="${ticketRequest}" method="post">
            <div class="row g-3 mb-3">
                <div class="col-sm-6">
                    <label for="customer_name" class="form-label">Customer name</label>
                    <input type="text" th:field="*{customer_name}" class="form-control" th:classappend="${#fields.hasErrors('customer_name')} ? 'is-invalid'" autocomplete="off" required>
                    <div class="field-error" th:if="${#fields.hasErrors('customer_name')}" th:errors="*{customer_name}"></div>
                </div>
                <div class="col-sm-6">
                    <label for="customer_email" class="form-label">Customer email</label>
                    <input type="email" th:field="*{customer_email}" class="form-control" th:classappend="${#fields.hasErrors('customer_email')} ? 'is-invalid'" autocomplete="off" required>
                    <div class="field-error" th:if="${#fields.hasErrors('customer_email')}" th:errors="*{customer_email}"></div>
                </div>
            </div>
            <div class="mb-3">
                <label for="subject" class="form-label">Subject</label>
                <input type="text" th:field="*{subject}" class="form-control" th:classappend="${#fields.hasErrors('subject')} ? 'is-invalid'" maxlength="255" autocomplete="off" required>
                <div class="field-error" th:if="${#fields.hasErrors('subject')}" th:errors="*{subject}"></div>
            </div>
            <div class="mb-4">
                <label for="description" class="form-label">Description</label>
                <textarea rows="5" th:field="*{description}" class="form-control" th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'" maxlength="5000" required></textarea>
                <div class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Create ticket</button>
                <a th:href="@{/tickets}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
