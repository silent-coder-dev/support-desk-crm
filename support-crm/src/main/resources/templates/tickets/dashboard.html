<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Queue')}"></head>
<body th:data-live-stream="@{/tickets/live-stream}">

<nav th:replace="~{fragments/layout :: appNav('queue')}"></nav>

<main class="container page">
    <a th:if="${currentUser != null and #strings.endsWith(currentUser.role, 'ADMIN')}" th:href="@{/admin/dashboard}" class="back-link"><i class="bi bi-arrow-left" aria-hidden="true"></i>Dashboard</a>
    <div class="page-header">
        <div>
            <h1 class="page-title">Queue</h1>
            <p class="page-subtitle">
                <span th:text="${tickets.size() == 1 ? '1 ticket' : tickets.size() + ' tickets'}">0 tickets</span>
                <span th:if="${tickets.size() >= ticketLimit}">(newest only, use search to find older tickets)</span>
                <span class="mx-1" aria-hidden="true">&middot;</span>
                <span class="live-status" id="liveStatus" aria-live="polite">Connecting</span>
            </p>
        </div>
        <a th:href="@{/tickets/new}" class="btn btn-primary"><i class="bi bi-plus-lg me-1" aria-hidden="true"></i>New ticket</a>
    </div>

    <div class="card-surface overflow-hidden">
        <div class="toolbar">
            <form method="get" th:action="@{/tickets}" class="toolbar-form">
                <div class="toolbar-search">
                    <i class="bi bi-search" aria-hidden="true"></i>
                    <input type="search" id="liveSearchInput" name="search" class="form-control"
                           placeholder="Search customer, ID, or subject" aria-label="Search tickets"
                           th:value="${searchQuery}" autocomplete="off">
                </div>
                <select id="statusFilter" name="status" class="form-select" aria-label="Filter by status" onchange="this.form.submit()">
                    <option value="">All statuses</option>
                    <option value="OPEN" th:selected="${selectedStatus != null and selectedStatus.name() == 'OPEN'}">Open</option>
                    <option value="IN_PROGRESS" th:selected="${selectedStatus != null and selectedStatus.name() == 'IN_PROGRESS'}">In progress</option>
                    <option value="CLOSED" th:selected="${selectedStatus != null and selectedStatus.name() == 'CLOSED'}">Closed</option>
                </select>
                <a th:if="${searchQuery != null or selectedStatus != null}" th:href="@{/tickets}" class="btn btn-quiet">Reset</a>
            </form>
            <div class="sort-group" role="group" aria-label="Sort tickets">
                <button type="button" class="sort-btn" data-sort="oldest">Oldest</button>
                <button type="button" class="sort-btn" data-sort="newest">Newest</button>
                <button type="button" class="sort-btn" data-sort="urgent">Active first</button>
            </div>
        </div>

        <div class="table-responsive">
            <table class="data-table" id="ticketsTable">
                <thead>
                <tr>
                    <th>Ticket</th>
                    <th class="d-none d-sm-table-cell">Customer</th>
                    <th>Subject</th>
                    <th>Status</th>
                    <th class="d-none d-md-table-cell">Time in progress</th>
                    <th class="d-none d-lg-table-cell">Created</th>
                </tr>
                </thead>
                <tbody id="ticketsBody">
                <tr th:each="t : ${tickets}" th:attr="data-timestamp=${t.created_at}, data-status=${t.status}">
                    <td><a th:href="@{'/tickets/' + ${t.ticket_id}}" class="ticket-id" th:text="${t.ticket_id}">TKT-001</a></td>
                    <td class="cell-strong text-nowrap d-none d-sm-table-cell" th:text="${t.customer_name}">Customer</td>
                    <td class="cell-truncate"><a th:href="@{'/tickets/' + ${t.ticket_id}}" class="text-reset" th:text="${t.subject}">Subject</a></td>
                    <td><span th:replace="~{fragments/layout :: status(${t.status})}"></span></td>
                    <td class="d-none d-md-table-cell">
                        <span th:if="${t.status.name() == 'IN_PROGRESS' and t.claimed_at != null}" class="timer live-timer" th:data-claimed-at="${t.claimed_at}">
                            <i class="bi bi-stopwatch" aria-hidden="true"></i><span>00:00:00</span>
                        </span>
                        <span th:if="${t.status.name() == 'IN_PROGRESS' and t.claimed_at == null}" class="text-muted">Not claimed</span>
                        <span th:if="${t.status.name() == 'OPEN'}" class="text-muted">Not claimed</span>
                        <span th:if="${t.status.name() == 'CLOSED' or t.status.name() == 'RESOLVED'}" class="text-muted">Done</span>
                    </td>
                    <td class="text-muted text-nowrap d-none d-lg-table-cell" th:text="${#temporals.format(t.created_at, 'dd MMM, hh:mm a')}">12 Oct, 04:30 PM</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:if="${#lists.isEmpty(tickets)}" class="empty-state">
            <i class="bi bi-inbox" aria-hidden="true"></i>
            No tickets found. Try a different search or filter.
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: toast(${toastMessage}, ${toastType})}"></div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/queue.js}"></script>
</body>
</html>
