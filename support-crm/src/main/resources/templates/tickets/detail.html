<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head(${ticket.ticket_id})}"></head>
<body>

<nav th:replace="~{fragments/layout :: appNav('queue')}"></nav>

<main class="container page" th:with="canEdit=${ticket.assigned_agent_id == null or (currentUser != null and (ticket.assigned_agent_id == currentUser.id or #strings.endsWith(currentUser.role, 'ADMIN')))}">
    <a th:href="@{/tickets}" class="back-link"><i class="bi bi-arrow-left" aria-hidden="true"></i>Queue</a>
    <div class="page-header">
        <div>
            <div class="d-flex align-items-center gap-2 mb-1">
                <span class="ticket-id" th:text="${ticket.ticket_id}">TKT-001</span>
                <span th:replace="~{fragments/layout :: status(${ticket.status})}"></span>
            </div>
            <h1 class="page-title" th:text="${ticket.subject}">Subject</h1>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-lg-8">
            <section class="card-surface card-body-pad mb-3">
                <h2 class="section-title">Description</h2>
                <p class="body-text" th:text="${ticket.description}">Description</p>
            </section>

            <section class="card-surface card-body-pad">
                <h2 class="section-title">Activity</h2>
                <div th:each="n : ${ticket.notes}" class="note">
                    <div class="note-meta">
                        <span class="note-author" th:text="${n.author_name}">Support Agent</span>
                        <span class="note-time" th:text="${#temporals.format(n.created_at, 'dd MMM yyyy, hh:mm a')}">Time</span>
                    </div>
                    <p class="body-text" th:text="${n.note_text}">Note</p>
                </div>
                <p th:if="${#lists.isEmpty(ticket.notes)}" class="text-muted small mb-0">No notes yet.</p>
            </section>
        </div>

        <div class="col-lg-4">
            <section class="card-surface card-body-pad mb-3" th:unless="${canEdit}">
                <h2 class="section-title">Being handled</h2>
                <p class="mb-0">This ticket is being handled by <strong th:text="${ticket.assigned_agent_name}">Agent</strong>. Only they or an admin can update it.</p>
            </section>

            <section class="card-surface card-body-pad mb-3" th:if="${canEdit}">
                <h2 class="section-title">Update ticket</h2>
                <form th:action="@{'/tickets/' + ${ticket.ticket_id} + '/update'}" th:object="${updateRequest}" method="post">
                    <input type="hidden" th:field="*{version}">
                    <div class="mb-3">
                        <label for="status" class="form-label">Status</label>
                        <select th:field="*{status}" class="form-select">
                            <option value="OPEN" th:selected="${ticket.status.name() == 'OPEN'}">Open</option>
                            <option value="IN_PROGRESS" th:selected="${ticket.status.name() == 'IN_PROGRESS'}">In progress</option>
                            <option th:if="${ticket.status.name() == 'RESOLVED'}" value="RESOLVED" selected>Resolved</option>
                            <option value="CLOSED" th:selected="${ticket.status.name() == 'CLOSED'}">Closed</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="notes" class="form-label">Progress note (the customer can read this)</label>
                        <textarea rows="4" th:field="*{notes}" class="form-control" maxlength="5000"
                                  placeholder="What did you find or do?"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Save changes</button>
                </form>
            </section>

            <section class="card-surface card-body-pad">
                <h2 class="section-title">Customer</h2>
                <div class="mb-3">
                    <div class="detail-label">Name</div>
                    <div class="detail-value" th:text="${ticket.customer_name}">Name</div>
                </div>
                <div>
                    <div class="detail-label">Email</div>
                    <div class="detail-value"><a th:href="'mailto:' + ${ticket.customer_email}" th:text="${ticket.customer_email}">email</a></div>
                </div>
            </section>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: toast(${toastMessage}, ${toastType})}"></div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
